[project]
name = "sih-26188-backend"
version = "0.1.0"
description = "SIH 26188 Document Verification Backend"
requires-python = "==3.12.*"

dependencies = [
    "easyocr==1.7.2",
    "facenet-pytorch==2.6.0",
    "fastapi[standard]==0.141.1",
    "imageio==2.37.4",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.2.0",
    "pyclipper==1.4.0",
    "python-bidi==0.6.11",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scikit-image==0.26.0",
    "scipy==1.13.1",
    "shapely==2.1.2",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "tqdm==4.70.0",
    "uvicorn==0.52.4"
]

[tool.fastapi]
entrypoint = "AI.api:app"
